name: Android Release Build & Sign

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x gradlew

    - name: Ensure Keystore Exists
      run: |
        if [ ! -f "my-upload-key.jks" ]; then
          echo "Keystore not found, generating release upload keystore..."
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=HonarZistan, OU=AIStudio, O=HonarZistan, L=Tehran, ST=Tehran, C=IR"
        else
          echo "Keystore found: my-upload-key.jks"
        fi

    - name: Build Signed APK & App Bundle (Release)
      run: |
        STORE_PASS="${{ secrets.STORE_PASSWORD }}"
        [ -z "$STORE_PASS" ] && STORE_PASS="android123"
        KEY_PASS="${{ secrets.KEY_PASSWORD }}"
        [ -z "$KEY_PASS" ] && KEY_PASS="android123"
        
        echo "Building release APK and AAB with release signing..."
        STORE_PASSWORD="$STORE_PASS" KEY_PASSWORD="$KEY_PASS" ./gradlew assembleRelease bundleRelease -x test -x lintVitalRelease -x lintVitalAnalyzeRelease --stacktrace

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload Signed AAB (Google Play)
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/app-release.aab
