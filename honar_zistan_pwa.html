        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
        }

        async function copyText(text, successMsg) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(successMsg);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast(successMsg);
            }
        }

        function copyQuoteByIndex(section, idx) {
            const data = contentData[currentLang];
            let quote = '';
            if (section === 'home') quote = data.home.identityQuote;
            if (section === 'chapters') quote = data.chapters[idx]?.quote || '';
            if (!quote) return;
            copyText(`${quote}\n— ${data.ui.attrSuffix}`, data.ui.copiedQuote);
        }

        function copyChapterLink(chId) {
            const url = `${window.location.origin}${window.location.pathname}#chapters/${chId}`;
            window.location.hash = `chapters/${chId}`;
            copyText(url, contentData[currentLang].ui.copiedLink);
        }

        function goToReflection(promptText) {
            pendingPromptTitle = promptText;
            switchTab('experiences', 'experiences');
        }

        function getSavedExperiences() {
            try { return JSON.parse(localStorage.getItem('hz_lived_experiences') || '[]'); }
            catch { return []; }
        }

        function buildFormPayload() {
            const titleEl = document.getElementById('exp-title');
            const textEl = document.getElementById('exp-text');
            const nameEl = document.getElementById('exp-name');
            const catEl = document.getElementById('exp-cat');
            const c1 = document.getElementById('c1');
            const c2 = document.getElementById('c2');
            return {
                id: Date.now(),
                name: (nameEl?.value || '').trim() || 'ناشناس / Anonymous',
                title: (titleEl?.value || '').trim(),
                category: catEl?.value || '',
                text: (textEl?.value || '').trim(),
                consentBook: Boolean(c1?.checked),
                consentApp: Boolean(c2?.checked)
            };
        }

        function saveExperience(e) {
            e.preventDefault();
            const data = contentData[currentLang];
            const item = buildFormPayload();
            if (!item.title || !item.text) {
                showToast(data.form.fillRequiredMsg);
                return;
            }
            const list = getSavedExperiences();
            list.unshift(item);
            localStorage.setItem('hz_lived_experiences', JSON.stringify(list));
            pendingPromptTitle = '';
            showToast(data.form.successMsg);
            renderTab('experiences');
        }

        function buildEmailBody(item) {
            return [
                `Honar Zistan — Lived Experience Submission`,
                `Author / Pseudonym: ${item.name}`,
                `Title: ${item.title}`,
                `Category: ${item.category}`,
                `Consent (Book): ${item.consentBook ? 'Yes' : 'No'}`,
                `Consent (App & Web): ${item.consentApp ? 'Yes' : 'No'}`,
                `Language: ${currentLang.toUpperCase()}`,
                ``,
                `--- Narrative ---`,
                item.text
            ].join('\n');
        }

        function sendExperienceEmail() {
            const data = contentData[currentLang];
            const item = buildFormPayload();
            if (!item.title || !item.text) {
                showToast(data.form.fillRequiredMsg);
                return;
            }
            // Save local backup too
            const list = getSavedExperiences();
            list.unshift(item);
            localStorage.setItem('hz_lived_experiences', JSON.stringify(list));

            const subject = encodeURIComponent(`[Honar Zistan] ${item.title}`);
            const body = encodeURIComponent(buildEmailBody(item));
            window.location.href = `mailto:${AUTHOR_EMAIL}?subject=${subject}&body=${body}`;
        }

        function copyExperienceEmail() {
            const data = contentData[currentLang];
            const item = buildFormPayload();
            if (!item.title || !item.text) {
                showToast(data.form.fillRequiredMsg);
                return;
            }
            const fullText = `To: ${AUTHOR_EMAIL}\nSubject: [Honar Zistan] ${item.title}\n\n${buildEmailBody(item)}`;
            copyText(fullText, data.form.copiedEmailMsg);
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            const isRtl = lang === 'fa' || lang === 'ar';
            document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
            document.body.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
            document.body.style.fontFamily = isRtl ? 'Vazirmatn, Tahoma, sans-serif' : 'system-ui, -apple-system, sans-serif';

            const data = contentData[lang];
            document.getElementById('brand-title').innerText = data.brand;
            document.getElementById('brand-subtitle').innerText = data.brandSub;
            document.getElementById('footer-area').innerText = data.footer;

            const tabButtons = document.querySelectorAll('#main-tabs button');
            data.tabs.forEach((label, idx) => {
                if (tabButtons[idx]) tabButtons[idx].innerText = label;
            });

            renderTab(activeTab);
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', currentTheme);
        }

        function switchTab(tab, hashOverride) {
            activeTab = tab;
            const buttons = document.querySelectorAll('#main-tabs button');
            buttons.forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
            if (hashOverride !== null) {
                const newHash = hashOverride || tab;
                if (window.location.hash !== `#${newHash}`) {
                    history.replaceState(null, '', `#${newHash}`);
                }
            }
            renderTab(tab);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderQuoteBox(quoteText, copyFnCall, copyLabel) {
            return `
                <div class="quote-wrap">
                    <div class="quote-text">${escapeHtml(quoteText)}</div>
                    <div class="quote-actions">
                        <button type="button" class="btn-mini" onclick="${copyFnCall}">📋 ${escapeHtml(copyLabel)}</button>
                    </div>
                </div>
            `;
        }

        function renderTab(tab) {
            const data = contentData[currentLang];
            const area = document.getElementById('content-area');

            if (tab === 'home') {
                area.innerHTML = `
                    <div class="card card-accent">
                        <span class="badge">${escapeHtml(data.home.badge)}</span>
                        <h1>${escapeHtml(data.home.title)}</h1>
                        ${renderQuoteBox(data.home.identityQuote, "copyQuoteByIndex('home', 0)", data.ui.copyQuote)}
                        <p>${escapeHtml(data.home.principle)}</p>
                        <hr class="divider">
                        <p>${escapeHtml(data.home.philosophy)}</p>
                    </div>
                `;
            } else if (tab === 'journey') {
                let html = `<div class="card card-accent"><span class="badge">${escapeHtml(data.journey.badge)}</span><h2>${escapeHtml(data.journey.title)}</h2></div>`;
                data.journey.sections.forEach(sec => {
                    html += `<div class="card"><h3>${escapeHtml(sec.heading)}</h3><p>${escapeHtml(sec.body)}</p></div>`;
                });
                area.innerHTML = html;
            } else if (tab === 'chapters') {
                let html = `<h2>${escapeHtml(data.chaptersTitle)}</h2>`;
                data.chapters.forEach((ch, idx) => {
                    html += `
                        <div class="card" id="${escapeHtml(ch.id)}">
                            <div class="card-header-row">
                                <span class="badge">${escapeHtml(ch.tag)}</span>
                                <button type="button" class="btn-mini" onclick="copyChapterLink('${escapeHtml(ch.id)}')">🔗 ${escapeHtml(data.ui.copyLink)}</button>
                            </div>
                            <h3>${escapeHtml(ch.title)}</h3>
                            ${renderQuoteBox(ch.quote, `copyQuoteByIndex('chapters', ${idx})`, data.ui.copyQuote)}
                            <p>${escapeHtml(ch.text)}</p>
                            ${ch.reflection ? `
                                <div class="reflection-box">
                                    <span class="reflection-title">${escapeHtml(data.ui.reflectionLabel)}</span>
                                    <span>${escapeHtml(ch.reflection)}</span>
                                    <div>
                                        <button type="button" class="btn-mini btn-gold" data-prompt="${escapeHtml(ch.reflection)}" onclick="goToReflection(this.getAttribute('data-prompt'))">✍️ ${escapeHtml(data.ui.reflectBtn)}</button>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                area.innerHTML = html;
            } else if (tab === 'experiences') {
                const saved = getSavedExperiences();
                const optionsHtml = data.form.categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
                const savedHtml = saved.length ? `
                    <div class="card">
                        <h3>${escapeHtml(data.form.savedTitle)}</h3>
                        ${saved.map(s => `
                            <div class="story-item">
                                <strong>${escapeHtml(s.title)}</strong> — <small>${escapeHtml(s.name)} (${escapeHtml(s.category)})</small>
                                <p style="margin-top:0.45rem;margin-bottom:0;">${escapeHtml(s.text)}</p>
                            </div>
                        `).join('')}
                    </div>
                ` : '';
                area.innerHTML = `
                    <div class="card card-accent">
                        <h2>${escapeHtml(data.expTitle)}</h2>
                        <p>${escapeHtml(data.expSubtitle)}</p>
                        <div class="notice-box">✉️ ${escapeHtml(data.expNotice)}</div>
                        <form onsubmit="saveExperience(event)">
                            <div class="form-group"><label>${escapeHtml(data.form.name)}</label><input id="exp-name" type="text"></div>
                            <div class="form-group"><label>${escapeHtml(data.form.title)}</label><input id="exp-title" type="text" value="${escapeHtml(pendingPromptTitle)}" required></div>
                            <div class="form-group"><label>${escapeHtml(data.form.category)}</label><select id="exp-cat" class="form-select">${optionsHtml}</select></div>
                            <div class="form-group"><label>${escapeHtml(data.form.text)}</label><textarea id="exp-text" rows="5" required></textarea></div>
                            <div class="checkbox-group">
                                <div class="checkbox-row"><input type="checkbox" id="c1"><label for="c1">${escapeHtml(data.form.consentBook)}</label></div>
                                <div class="checkbox-row"><input type="checkbox" id="c2"><label for="c2">${escapeHtml(data.form.consentApp)}</label></div>
                            </div>
                            <div class="btn-row">
                                <button type="button" class="btn-primary" onclick="sendExperienceEmail()">✉️ ${escapeHtml(data.form.submitEmail)}</button>
                                <button type="submit" class="btn-gold">💾 ${escapeHtml(data.form.submitLocal)}</button>
                                <button type="button" onclick="copyExperienceEmail()">📋 ${escapeHtml(data.form.copyEmailText)}</button>
                            </div>
                        </form>
                    </div>
                    ${savedHtml}
                `;
            } else if (tab === 'colophon') {
                area.innerHTML = `
                    <div class="card card-accent">
                        <h2>${escapeHtml(data.colophon.title)}</h2>
                        <p><strong>${escapeHtml(data.colophon.owner)}</strong></p>
                        <p style="color: var(--accent-gold); font-weight: 600;">${escapeHtml(data.colophon.father)}</p>
                        <p>${escapeHtml(data.colophon.emailLabel)} <a href="mailto:${AUTHOR_EMAIL}" style="color:var(--primary-color);font-weight:600;">${AUTHOR_EMAIL}</a></p>
                        <hr class="divider">
                        <p><strong>${escapeHtml(data.colophon.portfolio)}</strong></p>
                        <p style="font-size: 0.92rem; color: var(--text-muted);">${escapeHtml(data.colophon.items)}</p>
                    </div>
                `;
            }
        }

        function handleHashNavigation() {
            const raw = window.location.hash.replace(/^#/, '');
            if (!raw) return;
            if (raw.startsWith('chapters/')) {
                const targetId = raw.slice('chapters/'.length);
                switchTab('chapters', null);
                setTimeout(() => {
                    const el = document.getElementById(targetId);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 40);
                return;
            }
            if (['home', 'journey', 'chapters', 'experiences', 'colophon'].includes(raw)) {
                switchTab(raw, null);
            }
        }

        window.addEventListener('hashchange', handleHashNavigation);
        changeLanguage('fa');
        handleHashNavigation();
    </script>
